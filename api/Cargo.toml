[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { workspace = true }
serde = { workspace = true, features = ["derive"] }
domain = { path = "../domain" }

# Server-only dependencies
axum = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
portfolio = { path = "../portfolio", optional = true }
articles = { path = "../articles", optional = true }
books = { path = "../books", optional = true }
search = { path = "../search", optional = true }
analytics = { path = "../analytics", optional = true }
auth = { path = "../auth", optional = true }
database = { path = "../database", optional = true }
uuid = { version = "1.0", features = ["v4"], optional = true }
ron = { version = "0.8", optional = true }
pulldown-cmark = { version = "0.10", optional = true }

[features]
hydrate = []
ssr = [
    "leptos/ssr",
    "dep:axum",
    "dep:leptos_axum",
    "dep:sqlx",
    "dep:portfolio",
    "dep:articles",
    "dep:books",
    "dep:search",
    "dep:analytics",
    "dep:auth",
    "dep:database",
    "dep:uuid",
    "dep:ron",
    "dep:pulldown-cmark"
]
