[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { workspace = true }
serde = { workspace = true, features = ["derive"] }
domain = { path = "../domain" }

# Server-only dependencies
axum = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
portfolio = { path = "../portfolio", optional = true }
articles = { path = "../articles", optional = true }
books = { path = "../books", optional = true }
search = { path = "../search", optional = true }
analytics = { path = "../analytics", optional = true }
auth = { path = "../auth", optional = true }
database = { path = "../database", optional = true }
markdown = { path = "../markdown", optional = true }
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
ron = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
shared = { path = "../shared", optional = true }
config = { path = "../config", optional = true }

[features]
hydrate = []
ssr = [
    "leptos/ssr",
    "dep:axum",
    "dep:leptos_axum",
    "dep:portfolio",
    "dep:articles",
    "dep:books",
    "dep:search",
    "dep:analytics",
    "dep:auth",
    "dep:database",
    "dep:markdown",
    "dep:chrono",
    "dep:uuid",
    "dep:ron",
    "dep:pulldown-cmark",
    "dep:reqwest",
    "dep:serde_json",
    "dep:shared",
    "dep:config"
]
