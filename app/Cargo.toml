[package]
name = "app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { workspace = true, optional = true }
leptos = { workspace = true }
leptos_axum = { workspace = true, optional = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true, features = ["compression-full", "cors", "trace", "set-header"] }
assets = { path = "../assets", optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
ui = { path = "../ui" }
api = { path = "../api", optional = true }
cfg-if = { workspace = true }
wasm-bindgen = { version = "0.2.130", optional = true }
console_error_panic_hook = { version = "0.1.7", optional = true }
console_log = { version = "1.1.0", optional = true }
log = { workspace = true, optional = true }
database = { path = "../database", optional = true }
markdown = { path = "../markdown", optional = true }
domain = { path = "../domain", optional = true }
search = { path = "../search", optional = true }
dotenvy = { workspace = true, optional = true }
config = { path = "../config", optional = true }
articles = { path = "../articles", optional = true }
portfolio = { path = "../portfolio", optional = true }
auth = { path = "../auth", optional = true }
ron = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
rss = { workspace = true }

[features]
hydrate = [
    "ui/hydrate",
    "leptos/hydrate",
    "leptos_meta/hydrate",
    "leptos_router/hydrate",
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
    "dep:console_log",
    "dep:log"
]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "ui/ssr",
    "dep:api",
    "dep:tracing-subscriber",
    "dep:database",
    "dep:markdown",
    "dep:domain",
    "dep:search",
    "dep:dotenvy",
    "dep:config",
    "dep:articles",
    "dep:portfolio",
    "dep:auth",
    "dep:ron",
    "dep:chrono",
    "dep:serde",
    "dep:assets",
    "dep:serde_json"
]
wasm-bindgen = ["dep:wasm-bindgen"]
console_error_panic_hook = ["dep:console_error_panic_hook"]
console_log = ["dep:console_log"]
log = ["dep:log"]

[package.metadata.leptos]
output-name = "dev-site"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
env = "DEV=1"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
