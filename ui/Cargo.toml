[package]
name = "ui"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
domain = { path = "../domain" }
api = { path = "../api" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "HtmlElement", "NodeList", "Node", "Navigator", "Clipboard", "Event", "DomStringMap", "Storage", "KeyboardEvent", "SpeechSynthesis", "SpeechSynthesisUtterance"] }

axum = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }

[features]
hydrate = ["leptos/hydrate", "leptos_meta/hydrate", "leptos_router/hydrate"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:axum",
    "dep:leptos_axum",
    "api/ssr"
]

[lints]
workspace = true
